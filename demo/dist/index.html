<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>list-sticky Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            color: #333;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1rem;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .section {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 24px;
            overflow: hidden;
        }

        .section-title {
            padding: 16px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-bottom: 1px solid #eee;
            background: #fafafa;
        }

        .demo-panel {
            padding: 20px;
        }

        .demo-panel .info {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 12px;
        }

        .list-wrapper {
            height: 400px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
        }

        .list-wrapper.short {
            height: 200px;
        }

        .row {
            padding: 12px 16px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .row.sticky {
            background: #e8f4f8 !important;
            border-left: 3px solid #667eea;
        }

        .row .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .row .info {
            flex: 1;
        }

        .row .name {
            font-weight: 500;
        }

        .row .email {
            font-size: 0.8rem;
            color: #888;
        }

        .controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .controls button {
            padding: 6px 14px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.15s;
        }

        .controls button:hover {
            background: #f5f5f5;
            border-color: #667eea;
            color: #667eea;
        }

        .controls button.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
    </style>
  <script type="module" crossorigin src="/assets/index-CxqD_cCf.js"></script>
</head>

<body>
    <div id="root"></div>
</body>

</html>
